<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Plan de masse de Paris-Charles de Gaulle</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#fff;color:#1b2a41;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;z-index:5;height:52px;padding:0 10px;background:#fff;display:flex;align-items:center;gap:6px;border-bottom:1px solid #ddd}
#top h1{font-size:15px;margin:0;flex:1;line-height:1.15}button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:9px 11px;background:#e6e2d8;font-weight:700;color:#1b2a41}
button.on{background:#1b2a41;color:#fff}
#vp{position:absolute;left:0;right:0;top:52px;bottom:0;overflow:hidden;touch-action:none;background:#f3f3f3}
#w{position:absolute;left:0;top:0;transform-origin:0 0}#w img{position:absolute;display:block;max-width:none}
#hint{position:fixed;left:8px;bottom:8px;z-index:6;background:#fff;border:2px solid #1b2a41;border-radius:10px;padding:6px 10px;font-size:13px}
#lgm{position:fixed;inset:52px 0 0 0;z-index:8;background:#fff;display:none;overflow:auto;padding:10px}#lgm img{max-width:100%;width:900px;display:block;margin:0 auto 10px}
body.emb #top{background:transparent;border:0;justify-content:flex-end;pointer-events:none}body.emb #top h1{display:none}body.emb #top button{pointer-events:auto;box-shadow:0 2px 8px rgba(27,42,65,.25);background:#fff}body.emb #top button.on{background:#1b2a41;color:#fff}body.emb #vp{top:0}body.emb #hint{display:none}</style></head><body>
<div id="top"><h1>Plan de masse de Paris-Charles de Gaulle</h1><button id="bL">Légende</button><button id="bR">Plan entier</button></div>
<div id="vp"><div id="w"></div></div><div id="hint">Pincez ou molette pour zoomer · glissez pour vous déplacer</div>
<div id="lgm"><img src="legend.jpg"><button id="bX">Fermer</button></div>
<script>
var W=12284,H=7087,K=5,T=512,cur="all";
var Q=new URLSearchParams(location.search),EMB=Q.has('e'),OFF=EMB?0:52;if(EMB)document.body.classList.add('emb');var vp=document.getElementById('vp'),w=document.getElementById('w'),s=1,x=0,y=0,pts={},d0=0,cache={};
function vw(){return vp.clientWidth}function vh(){return vp.clientHeight}
function fit(){s=Math.min(vw()/W,vh()/H);x=(vw()-W*s)/2;y=(vh()-H*s)/2;draw()}
function draw(){var mn=Math.min(vw()/W,vh()/H)*.9;s=Math.max(mn,Math.min(s,2.5));
 w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';
 var z=Math.max(0,Math.min(K,K+Math.ceil(Math.log2(s)))),sc=Math.pow(2,K-z),tw=T*sc;
 var x0=Math.max(0,Math.floor(-x/s/tw)),y0=Math.max(0,Math.floor(-y/s/tw)),x1=Math.min(Math.ceil(W/tw)-1,Math.floor((vw()-x)/s/tw)),y1=Math.min(Math.ceil(H/tw)-1,Math.floor((vh()-y)/s/tw));
 var want={};
 for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){var k=cur+'/'+z+'/'+tx+'/'+ty;want[k]=1;
  if(!cache[k]){var im=new Image();im.src=cur+'/'+z+'/'+tx+'/'+ty+'.webp';im.style.left=tx*tw+'px';im.style.top=ty*tw+'px';im.dataset.sc=sc;im.onload=function(){this.style.width=this.naturalWidth*this.dataset.sc+'px'};im.style.height='auto';im.style.zIndex=z;w.appendChild(im);cache[k]=im}}
 for(var k in cache){var p=k.split('/');if(!want[k]&&(p[0]!=cur||+p[1]>=z)){cache[k].remove();delete cache[k]}}
}
function zoomAt(cx,cy,k){var ns=Math.max(.05,Math.min(s*k,2.5));k=ns/s;x=cx-(cx-x)*k;y=cy-(cy-y)*k;s=ns;draw()}
vp.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY-OFF,e.deltaY<0?1.3:.77)},{passive:false});
vp.addEventListener('pointerdown',function(e){vp.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};d0=0});
vp.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;var ids=Object.keys(pts);
 if(ids.length==1){x+=e.clientX-pts[e.pointerId].x;y+=e.clientY-pts[e.pointerId].y;pts[e.pointerId]={x:e.clientX,y:e.clientY};draw()}
 else{pts[e.pointerId]={x:e.clientX,y:e.clientY};var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(d0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2-OFF,d/d0);d0=d}});
function up(e){delete pts[e.pointerId];d0=0}vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('dblclick',function(e){zoomAt(e.clientX,e.clientY-OFF,2)});
document.getElementById('bR').onclick=fit;
document.getElementById('bL').onclick=function(){document.getElementById('lgm').style.display='block'};
document.getElementById('bX').onclick=function(){document.getElementById('lgm').style.display='none'};
document.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){cur=b.dataset.l;document.querySelectorAll('[data-l]').forEach(function(o){o.classList.toggle('on',o==b)});for(var k in cache){cache[k].remove();delete cache[k]}draw()}});
function fit0(){fit();var V=Q.get('v');if(V){var a=V.split(',').map(Number);s=vw()/(W*a[2]);if(H*s<vh())s=vh()/H;x=vw()/2-a[0]*W*s;y=vh()/2-a[1]*H*s;draw();return}if(EMB&&vw()<vh()){s=vh()/H;x=(vw()-W*s)/2;y=0;draw()}}
var L0=Q.get('l');if(L0){var bb=document.querySelector('[data-l="'+L0+'"]');if(bb)bb.click()}
fit0();addEventListener('resize',fit0);
</script></body></html>
