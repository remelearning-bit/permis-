#libre{position:fixed;right:10px;top:8px;z-index:50;display:flex;align-items:center;gap:6px;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em}
#libre a,#libre button{background:#263C52;color:#fff;border:0;border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;line-height:1}
#libre button:disabled{opacity:.35;cursor:default}
#libre span{background:#fff;color:#263C52;border:2px solid #263C52;border-radius:999px;padding:5px 10px;line-height:1}
#libre select{font:inherit;border:2px solid #263C52;border-radius:999px;padding:5px 8px;color:#263C52;background:#fff;max-width:42vw}
#libre-tag{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:50;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#263C52;background:#ffffffcc;padding:3px 10px;border-radius:999px;pointer-events:none}
@media (max-width:760px){.stage{height:calc(100vh - 46px)!important;height:calc(100svh - 46px)!important}
#libre{top:auto;bottom:0;left:0;right:0;height:46px;background:#fff;border-top:1px solid #263C5233;padding:0 8px;justify-content:space-between;gap:5px}
#libre select{flex:1;max-width:none;min-width:0}#libre-tag{display:none}}
</style></head><body><style>
:root{--marine:#263C52;--orange:#E94E1B;--vert:#2E8B57;--encre:#1C2B3A;--brume:#eef0ef;--bleu:#3C7DC4;--sable:#F4F1EA;--qh:44vh}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--encre);font-family:Barlow,system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}
.stage{position:relative;height:100vh;height:100svh;min-height:540px;overflow:hidden;background:var(--brume)}
/* bandeau */
.top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:14px;padding:10px 5vw;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--marine);pointer-events:none}
.top .b{background:var(--marine);color:#fff;padding:5px 10px}
.top .s{background:rgba(255,255,255,.92);padding:5px 10px}
.top .clock{margin-left:auto;background:#fff;padding:5px 12px;border:2px solid var(--marine);font-size:17px;letter-spacing:.04em;text-transform:none}
/* la scène du haut */
.scene{position:absolute;left:0;right:0;top:0;height:calc(100% - var(--qh));overflow:hidden;background:var(--brume)}
.stage.full .scene{height:100%}
.scene img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding-top:50px}
.scene img.ph.cover{object-fit:cover;padding:0}
.scene .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(238,240,239,.92) 0%,rgba(238,240,239,.75) 45%,rgba(238,240,239,.1) 100%)}
.scene .veil.side{background:linear-gradient(90deg,rgba(238,240,239,.95) 0%,rgba(238,240,239,.86) 48%,rgba(238,240,239,.2) 78%,rgba(238,240,239,0) 100%)}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding-top:50px;background:#000}
.scene .html{position:absolute;inset:0;padding:64px 5vw 16px;display:flex;align-items:center;justify-content:center}
/* photo + cartes : côte à côte, la photo grande, les cartes centrées à côté */
.scene.split{display:flex;align-items:center;gap:2.4vw;padding:62px 4vw 18px}
.scene.split video{flex:0 0 58%;width:58%}
.scene .z3d{position:absolute;inset:50px 0 0 0;overflow:hidden}.scene .svgbox{background:#e3e6e9}
.spotbox{position:absolute;inset:58px 2vw 12px;display:flex;align-items:center;justify-content:center}.spotin{position:relative}.spotin img{display:block;width:100%;height:100%;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.spot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:0;background:transparent;pointer-events:none;padding:0}.spot.live{pointer-events:auto;cursor:pointer}
.spot.ok{border:5px solid var(--vert);background:rgba(46,139,87,.14)}.spot.ok::after{content:"✓";position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:50%;background:var(--vert);color:#fff;font:700 20px/30px Barlow,sans-serif;text-align:center}.scene.split .z3d{position:relative;inset:auto;flex:0 0 58%;align-self:stretch;box-shadow:0 8px 30px rgba(0,0,0,.12)}.scene.split img.ph{flex:0 1 auto;width:auto;max-width:60%;min-width:0}
.scene.split img.ph,.scene.split video{position:relative;inset:auto;height:auto;max-height:100%;padding:0;object-fit:contain;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.scene.split .html{position:relative;inset:auto;flex:1;min-width:0;align-self:stretch;padding:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.cap{position:absolute;left:5vw;bottom:3vh;z-index:3;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(26px,3.2vw,44px);color:#fff;background:var(--marine);padding:8px 20px;opacity:0;transform:translateY(16px);transition:opacity .45s,transform .45s;pointer-events:none}
.cap.on{opacity:1;transform:none}
/* couverture */
.title{position:absolute;left:5vw;top:11vh;z-index:3;max-width:min(900px,90vw);text-shadow:0 0 6px #fff,0 0 14px #fff,0 0 24px #fff}
.title small{display:inline-block;background:var(--marine);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:16px;padding:6px 12px;text-shadow:none}
.title h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(38px,5.4vw,84px);line-height:.95;color:var(--marine);margin:12px 0 20px}
.title .who{max-width:700px;margin-bottom:14px}
.go{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:14px;font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;color:#fff;background:#b9c0c7;padding:12px 30px 12px 12px;border-radius:999px;transition:background .3s,transform .2s;margin-top:10px;text-shadow:none}
.go .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);transition:width .25s linear}
.go>*{position:relative}.go svg{width:48px;height:48px;flex:none}
.go.ready{background:var(--orange);box-shadow:0 12px 30px rgba(233,78,27,.35)}
.go:disabled{cursor:default}
/* cartes posées sur la scène */
.alpha{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;max-width:900px}
.alpha div{background:#fff;padding:8px 6px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08)}.alpha b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1;color:var(--marine)}.alpha span{font-size:14px;color:var(--encre)}
.alpha-ex{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:18px}.alpha-ex span{background:var(--marine);color:#fff;padding:8px 14px}.alpha-ex b{color:#ffd166}
.alpha-wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.cards{display:grid;gap:.8em;width:100%;max-width:1500px;font-size:17px;grid-template-columns:repeat(auto-fit,minmax(12em,1fr))}
.card{background:#fff;border-left:6px solid var(--marine);padding:.75em 1em;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card.on{opacity:1;transform:none}
.card b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5em;line-height:1.02;color:var(--marine);margin-bottom:.35em}
.card span{font-size:1em;line-height:1.35}
.cards.g12{grid-template-columns:repeat(12,1fr)}.cards.g12>.card{grid-column:span var(--w,12)}
.card.hd{background:var(--marine);border-left-color:var(--marine);padding:.55em 1em}.card.hd b{color:#fff;margin:0;font-size:1.45em}
.card.big b{font-size:2.5em}.card.num b{white-space:nowrap}
/* cartes à retourner */
.flips{display:grid;gap:16px;width:100%;max-width:1000px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.flip{position:relative;min-height:150px;cursor:pointer;perspective:800px}
.flip .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.flip .f{background:var(--marine);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:56px;border:4px solid #fff}
.flip .k{background:#fff;color:var(--marine);transform:rotateY(180deg);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(18px,1.7vw,24px);line-height:1.15;border-left:6px solid var(--orange)}
.flip.open{cursor:default}
/* le permis */
.permis{background:#fff;border:3px solid var(--marine);width:min(640px,92vw);padding:16px 20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.permis .t{display:flex;align-items:center;justify-content:space-between;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--marine)}
.permis .t em{font-style:normal;background:var(--marine);color:#fff;padding:2px 12px;font-size:30px}
.permis ol{list-style:none;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.permis li{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;padding:5px 10px;border:2px solid #c9cdd2;color:#6b7580;display:flex;gap:8px;align-items:center}
.permis li i{width:16px;height:16px;border:2px solid #c9cdd2;flex:none;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.permis li.ok{border-color:var(--vert);color:var(--vert)}.permis li.ok i{background:var(--vert);border-color:var(--vert);color:#fff}
.permis li.now{border-color:var(--orange);color:var(--orange)}.permis li.now i{border-color:var(--orange)}
.permis .aoc{margin-top:12px;font-size:13px;color:var(--marine);border-top:1px dashed #c9cdd2;padding-top:8px}
/* main */
.hand{position:absolute;z-index:4;width:54px;height:54px;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.hand.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-6px)}}
/* panneau du bas */
.q{position:absolute;left:0;right:0;bottom:0;height:var(--qh);z-index:5;background:#fff;padding:16px 5vw 16px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
.q.on{transform:none}
.q .body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.who{display:flex;align-items:flex-start;gap:14px;font-size:21px;line-height:1.3;opacity:.6;transition:opacity .3s}
.who.now{opacity:1}
.who .av{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;color:#fff;background:var(--marine)}
.who.x .av{background:var(--bleu)}
.who b{font-family:"Barlow Condensed",sans-serif;color:var(--orange);letter-spacing:.1em;text-transform:uppercase;font-size:15px;display:block;margin-top:2px}
.who.x b{color:var(--bleu)}
.q h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(26px,3vw,42px);line-height:1;color:var(--marine)}
.item{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,36px);line-height:1.1;color:var(--marine);border-left:6px solid var(--orange);padding:6px 16px;background:var(--sable)}
.wait{opacity:0!important}.hold{pointer-events:none}
.opts button.wait{transform:translateY(10px)}.opts button,.flip,.journal>div{transition:opacity .45s,transform .45s}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opts button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(19px,1.9vw,26px);padding:10px 22px;border:3px solid var(--marine);color:var(--marine);border-radius:999px;transition:background .2s,color .2s;text-align:left}
.opts button:hover:not(:disabled){background:var(--marine);color:#fff}
.opts button.ok{background:var(--vert);border-color:var(--vert);color:#fff}
.opts button.ko{background:var(--orange);border-color:var(--orange);color:#fff}
.opts button:disabled:not(.ok){opacity:.35;cursor:default}
.fb{font-size:clamp(18px,1.6vw,22px);line-height:1.35;max-width:78ch}
.fb b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(24px,2.2vw,32px);margin-right:6px}
.g{color:var(--vert)}.r{color:var(--orange)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.next{position:relative;overflow:hidden;font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;color:#fff;background:#b9c0c7;padding:10px 30px;border-radius:999px;transition:background .3s}
.next .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);transition:width .25s linear}
.next span.lbl{position:relative}
.next.ready{background:var(--orange)}
.next:disabled{cursor:default}
.again{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;color:var(--marine);text-decoration:underline;text-underline-offset:5px}
.hint{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--marine)}
.prog{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;color:#6b7580;margin-left:auto}
.journal{border-left:4px solid var(--marine);padding-left:14px;font-size:19px;line-height:1.5}
.journal b{font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:var(--orange);margin-right:8px}
.credit{position:absolute;right:10px;bottom:calc(var(--qh) + 4px);z-index:5;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.stage.full .credit{bottom:6px}

}

const WHO={d:["Damienne","D",""],x:["Xavier","X","x"]};
const SPEED=14;
const GAP=1000; // les choix apparaissent l'un après l'autre
function stagger(c,gap){if(!c)return Promise.resolve();gap=gap||GAP;const els=[...c.children];els.forEach(e=>e.classList.add("wait","hold"));
 return new Promise(r=>{els.forEach((e,i)=>setTimeout(()=>{e.classList.remove("wait");if(i===els.length-1){els.forEach(x=>x.classList.remove("hold"));r()}},gap*(i+1)))})}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const journal=[];
function setClock(t){const c=$("clock");if(t==null){c.hidden=true;return}c.hidden=false;c.textContent=t}

/* ===== la voix : elle bloque le bouton, qui se remplit pendant qu'elle parle ===== */
let speaking=null;
function speak(line,fillEl,onProgress){return new Promise(res=>{const est=Math.max(2500,line.t.length/SPEED*1000);
 if(speaking)speaking.stop();
 let a=null,t0=0,raf=0,stopped=false;
 const tick=()=>{if(stopped)return;let p;if(a&&a.duration>0&&isFinite(a.duration))p=a.currentTime/a.duration;else p=(performance.now()-t0)/est;p=Math.min(1,p);if(fillEl)fillEl.style.width=(p*100)+"%";onProgress&&onProgress(p);if(p<1||(a&&!a.ended&&!a.error))raf=requestAnimationFrame(tick)};
 const end=()=>{if(stopped)return;stopped=true;cancelAnimationFrame(raf);if(fillEl)fillEl.style.width="100%";speaking=null;res()};
 speaking={stop(){if(stopped)return;stopped=true;cancelAnimationFrame(raf);if(a)a.pause();speaking=null;res()}};
 if(!line.id){t0=performance.now();raf=requestAnimationFrame(tick);setTimeout(end,est);return}
 a=new Audio("../audio/"+line.id+".mp3");a.onended=end;
 a.onerror=()=>{a=null;t0=performance.now();raf=requestAnimationFrame(tick);setTimeout(end,est)};
 a.oncanplay=()=>{if(t0)return;t0=performance.now();a.play().catch(()=>{a=null;raf=requestAnimationFrame(tick);setTimeout(end,est)});raf=requestAnimationFrame(tick)};
 a.load();
 setTimeout(()=>{if(!t0&&!stopped){a=null;t0=performance.now();raf=requestAnimationFrame(tick);setTimeout(end,est)}},1500)})}

/* ===== panneau ===== */
let panelOn=false;
function panel(on){panelOn=on;$("q").classList.toggle("on",on);$("st").classList.toggle("full",!on)}
function bubble(line,now){const w=WHO[line.who];const el=document.createElement("div");el.className="who "+w[2]+(now?" now":"");el.innerHTML=`<div class="av">${w[1]}</div><div><b>${w[0]}</b><span>${line.t}</span></div>`;return el}
function clearPanel(){$("qbody").innerHTML="";$("bar").innerHTML=""}
/*NOTXT*/document.body.classList.add("notxt");(function(){const b=$("qbody"),st=$("st");let tm=0;const chk=()=>{const only=b.children.length>0&&[...b.children].every(c=>c.classList.contains("who")||c.classList.contains("hint"));if(st.classList.contains("slim")!==only){st.classList.toggle("slim",only);clearTimeout(tm);tm=setTimeout(()=>dispatchEvent(new Event("resize")),480)}};new MutationObserver(chk).observe(b,{childList:true})})();
function nextButton(label){const b=document.createElement("button");b.className="next";b.disabled=true;b.innerHTML=`<span class="fill"></span><span class="lbl">${label||"Suivant"}</span>`;$("bar").appendChild(b);return b}
function readyButton(label){const b=nextButton(label);b.disabled=false;b.classList.add("ready");return b}
async function dialogue(lines,btn,hooks){const g=gen;const body=$("qbody");const fill=btn?btn.querySelector(".fill"):null;const total=lines.reduce((s,l)=>s+l.t.length,0);let done=0;
 for(const line of lines){body.querySelectorAll(".who").forEach(x=>x.classList.remove("now"));const el=bubble(line,true);body.appendChild(el);body.scrollTop=body.scrollHeight;
  const hk=(hooks&&hooks[line.id]||[]).map(h=>({p:h[0],f:h[1],fired:false}));
  await speak(line,null,p=>{if(fill)fill.style.width=((done+p*line.t.length)/total*100)+"%";hk.forEach(h=>{if(!h.fired&&p>=h.p){h.fired=true;h.f()}})});
  if(g!==gen)return new Promise(()=>{});hk.forEach(h=>{if(!h.fired){h.fired=true;h.f()}});done+=line.t.length}
 if(btn){btn.disabled=false;btn.classList.add("ready")}}
function showHand(el){const h=$("hand");if(!el){h.classList.remove("on");return}const r=el.getBoundingClientRect(),s=$("st").getBoundingClientRect();h.style.left=(r.left-s.left+r.width/2+6)+"px";h.style.top=(r.top-s.top+r.height/2+4)+"px";h.classList.add("on")}

/* ===== la scène ===== */
function scene(sc){if(window.__z3d){try{window.__z3d.destroy()}catch(e){}window.__z3d=null}const s=$("scene");s.innerHTML="";$("cap").classList.remove("on");$("credit").textContent=sc.credit||"";
 if(sc.permis)sc.html=permisHtml(sc.permis[0],sc.permis[1]);
 s.classList.toggle("split",!!((sc.video||((sc.photo||sc.z3d||sc.svg)&&!sc.cover))&&sc.cards));
 if(sc.svg){const z=document.createElement("div");z.className="z3d svgbox";z.innerHTML=sc.svg;s.appendChild(z)}
 if(sc.z3d){const z=document.createElement("div");z.className="z3d";s.appendChild(z);const go=()=>{if(!z.isConnected)return;window.__z3d=window.Zone3D.mount(z,sc.z3d);requestAnimationFrame(()=>dispatchEvent(new Event("resize")))};window.Zone3D?requestAnimationFrame(go):addEventListener("zone3d-ready",go,{once:true})}
 if(sc.photo&&!sc.video){const im=document.createElement("img");im.className="ph"+(sc.cover?" cover":"");im.src=PH[sc.photo];im.alt="";s.appendChild(im);if(sc.veil){const v=document.createElement("div");v.className="veil";s.appendChild(v)}}
 if(sc.type==="cover"){const v=document.createElement("div");v.className="veil side";s.appendChild(v)}
 if(sc.video){const v=document.createElement("video");v.src=sc.video+"#t=0.1";v.preload="metadata";v.controls=false;v.playsInline=true;s.appendChild(v)}
 if(sc.html){const d=document.createElement("div");d.className="html";d.innerHTML=sc.html;s.appendChild(d);return d}
 return s}
function cap(t){const c=$("cap");if(!t){c.classList.remove("on");return}c.textContent=t;c.classList.add("on")}
function cardsHtml(cards,big){const g=cards.some(c=>c.w);const st=c=>c.w?` style="--w:${c.w};--wt:${c.w>=12?6:c.w==4?2:3}"`:"";return `<div class="cards n${cards.length}${g?" g12":""}">${cards.map(c=>c.h?`<div class="card hd"${st(c)}><b>${c.h}</b></div>`:`<div class="card${big||c.big?" big":""}${c.big?" num":""}"${st(c)}><b>${c.t}</b>${c.s?`<span>${c.s}</span>`:""}</div>`).join("")}</div>`}
/* les cartes prennent toute la place disponible : on cherche la plus grande taille de texte qui tient */
function fitCards(){document.querySelectorAll(".scene .html").forEach(h=>{const c=h.querySelector(".cards");if(!c||!h.clientHeight)return;
 const big=matchMedia("(max-width:760px)").matches?22:30;let lo=12,hi=big;
 for(let k=0;k<9;k++){const m=(lo+hi)/2;c.style.fontSize=m+"px";(h.scrollHeight<=h.clientHeight+1&&h.scrollWidth<=h.clientWidth+1&&[...c.children].every(x=>x.scrollWidth<=x.clientWidth+1))?lo=m:hi=m}c.style.fontSize=lo+"px"})}
addEventListener("resize",()=>requestAnimationFrame(fitCards));
function revealCards(sc){const els=[...$("scene").querySelectorAll(".card")];const hooks={};sc.lines.forEach((l,li)=>{hooks[l.id]=[]});
 // chaque carte apparaît au moment indiqué (réplique, avancement), sinon réparties sur la première réplique
 sc.cards.forEach((c,i)=>{const at=c.at||[sc.lines[0].id,(i+.5)/sc.cards.length];(hooks[at[0]]=hooks[at[0]]||[]).push([at[1],()=>els[i].classList.add("on")])});return hooks}

/* ===== les types d'écrans ===== */
const T={
 async cover(sc,next){panel(false);scene(sc);const s=$("scene");
  const ti=document.createElement("div");ti.className="title";ti.innerHTML=`<small>${sc.sur}</small><h1>${sc.title}</h1><div id="tiwho"></div><button class="go" id="go" disabled><span class="fill"></span><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#fff"/><path d="M26 19 L47 32 L26 45 Z" fill="#E94E1B"/></svg><span>${sc.btn||"Commencer"}</span></button>`;s.appendChild(ti);
  const g=gen;const go=$("go"),fill=go.querySelector(".fill"),total=sc.lines.reduce((a,l)=>a+l.t.length,0);let done=0;
  for(const line of sc.lines){const w=$("tiwho");w.querySelectorAll(".who").forEach(x=>x.classList.remove("now"));w.appendChild(bubble(line,true));await speak(line,null,p=>fill.style.width=((done+p*line.t.length)/total*100)+"%");if(g!==gen)return;done+=line.t.length}
  go.disabled=false;go.classList.add("ready");showHand(go);go.onclick=()=>{showHand(null);next()}},
 async info(sc,next){panel(true);scene(sc);cap(sc.cap);clearPanel();
  let hooks=null;if(sc.cards){$("scene").insertAdjacentHTML("beforeend",`<div class="html">${cardsHtml(sc.cards,sc.big)}</div>`);hooks=revealCards(sc);fitCards();const im=$("scene").querySelector("img.ph");if(im&&!im.complete)im.onload=fitCards}
  const btn=nextButton(sc.btn);await dialogue(sc.lines,btn,hooks);btn.onclick=next;
  /* la vidéo ne démarre qu'une fois la voix terminée : jamais deux sons en même temps */
  const v=$("scene").querySelector("video");if(v&&v.isConnected){v.controls=true;v.play().catch(()=>{})}},
 async flip(sc,next){panel(true);scene(sc);cap(sc.cap);clearPanel();
  const d=document.createElement("div");d.className="html";d.innerHTML=`<div class="flips">${sc.cards.map((c,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="f">${c.front}</div><div class="k">${c.back}</div></div></div>`).join("")}</div>`;$("scene").appendChild(d);stagger(d.querySelector(".flips"),GAP*.6);
  await dialogue(sc.lines,null);let left=sc.cards.length;const flips=[...d.querySelectorAll(".flip")];
  const arm=()=>{const f=flips.find(x=>!x.classList.contains("open"));if(f)showHand(f.querySelector(".f"));else showHand(null)};arm();
  const h=document.createElement("div");h.className="hint";h.textContent="Cliquez sur chaque carte.";$("qbody").appendChild(h);
  flips.forEach(f=>f.onclick=async()=>{if(f.classList.contains("open"))return;f.classList.add("open");showHand(null);const c=sc.cards[+f.dataset.i];
   if(c.line){h.remove();await dialogue([c.line],null)}left--;if(left===0){const btn=sc.after?nextButton():readyButton();if(sc.after)await dialogue(sc.after,btn);btn.onclick=next}else{arm();if(c.line){$("qbody").appendChild(h)}}})},
 async classer(sc,next){ // un élément à la fois, à ranger dans une case ; buckets:[[clé,libellé]], items:[{t,b,fb:{clé:texte}}]
  panel(true);scene(sc);cap(sc.cap);clearPanel();await dialogue(sc.lines,null);let i=0,errs=0;const body=$("qbody");
  const show=()=>{body.innerHTML="";if(i>=sc.items.length){journal.push([sc.when,sc.jl+(errs?` : ${errs} erreur${errs>1?"s":""} corrigée${errs>1?"s":""}`:" : sans erreur")]);const btn=sc.after?nextButton():readyButton();(async()=>{if(sc.after)await dialogue(sc.after,btn);btn.onclick=next})();return}
   const it=sc.items[i];const h=document.createElement("h2");h.textContent=sc.q;body.appendChild(h);const el=document.createElement("div");el.className="item";el.textContent=it.t;body.appendChild(el);
   const opts=document.createElement("div");opts.className="opts";const fb=document.createElement("div");fb.className="fb";
   (sc.fixed?sc.buckets:shuffle(sc.buckets)).forEach(([k,lab])=>{const b=document.createElement("button");b.textContent=lab;b.onclick=()=>{const ok=k===it.b;opts.querySelectorAll("button").forEach(x=>x.classList.remove("ko"));b.classList.add(ok?"ok":"ko");
    fb.innerHTML=`<b class="${ok?"g":"r"}">${ok?"Exact.":"Pas tout à fait."}</b>${(it.fb&&it.fb[k])||(ok?it.ok||"":it.ko||"")}`;body.scrollTop=body.scrollHeight;
    if(ok){opts.querySelectorAll("button").forEach(x=>x.disabled=true);const btn=readyButton(i<sc.items.length-1?"Suivant":"Terminer");btn.onclick=()=>{$("bar").innerHTML="";i++;show()}}else errs++};opts.appendChild(b)});
   body.appendChild(opts);body.appendChild(fb);stagger(opts,i?GAP/2:GAP);const p=document.createElement("div");p.className="prog";p.textContent=`${i+1} / ${sc.items.length}`;$("bar").innerHTML="";$("bar").appendChild(p)};
  show()},
 async quiz(sc,next){ // questions:[{photo?,cap?,line,q,opts:[[t,ok,fb]]}] ; stamp : coche sur le permis
  let i=0,tries=0;const run=async()=>{const qq=sc.questions[i];panel(true);scene(Object.assign({},sc,qq.photo?{photo:qq.photo}:{}));cap(qq.cap||sc.cap);clearPanel();const body=$("qbody");
   if(qq.line)await dialogue([qq.line],null);const h=document.createElement("h2");h.textContent=qq.q;body.appendChild(h);
   const opts=document.createElement("div");opts.className="opts";const fb=document.createElement("div");fb.className="fb";
   (qq.fixed?qq.opts:shuffle(qq.opts)).forEach(o=>{const b=document.createElement("button");b.textContent=o[0];b.onclick=()=>{tries++;opts.querySelectorAll("button").forEach(x=>x.classList.remove("ko"));b.classList.add(o[1]?"ok":"ko");
    fb.innerHTML=`<b class="${o[1]?"g":"r"}">${o[1]?"Exact.":"Pas tout à fait."}</b>${o[2]}`;body.scrollTop=body.scrollHeight;
    if(o[1]){opts.querySelectorAll("button").forEach(x=>x.disabled=true);const btn=readyButton(i<sc.questions.length-1?"Question suivante":"Suivant");btn.onclick=()=>{i++;if(i<sc.questions.length)run();else{journal.push([sc.when,sc.jl+" : "+(sc.questions.length>1?sc.questions.length+" bonnes réponses":"bonne réponse")+(tries===sc.questions.length?(sc.questions.length>1?", du premier coup":" du premier coup"):", en "+tries+" essais")]);next()}}}};opts.appendChild(b)});
   body.appendChild(opts);body.appendChild(fb);body.scrollTop=body.scrollHeight;stagger(opts)};run()},
 async vehicle(sc,next){panel(true);const s=scene({});cap(sc.cap);clearPanel();
  const d=document.createElement("div");d.style.cssText="position:absolute;inset:0;touch-action:none";s.appendChild(d);
  const MOD=sc.mod||"Vehicle3D",EV=sc.ev||"vehicle3d-ready";if(!window[MOD])await new Promise(r=>addEventListener(EV,r,{once:true}));
  let api=null;api=window[MOD].mount(d,{onFrame(){if(api&&api.active){const [x,y]=api.screenPos(api.active);const h=$("hand"),r=d.getBoundingClientRect(),st=$("st").getBoundingClientRect();h.style.left=(r.left-st.left+x+10)+"px";h.style.top=(r.top-st.top+y+8)+"px"}}});
  window.__v3d=api;api.present(sc.present||9);await dialogue(sc.lines,null);const body=$("qbody");
  for(const h of sc.points){body.innerHTML="";const hint=document.createElement("div");hint.className="hint";hint.textContent=h.hint;body.appendChild(hint);
   const p=api.activate(h.k);$("hand").classList.add("on");await p;$("hand").classList.remove("on");body.innerHTML="";await dialogue([h.line],null)}
  const btn=nextButton();await dialogue(sc.after||[],btn);btn.onclick=()=>{api.destroy();next()}},
 async spot(sc,next){ // plan avec des cercles à trouver : spots:[[x%,y%,rayon% de la largeur]]
  panel(true);const s=scene({});cap(sc.cap);clearPanel();
  const box=document.createElement("div");box.className="spotbox";const inn=document.createElement("div");inn.className="spotin";const im=document.createElement("img");im.src=PH[sc.photo];im.alt="";inn.appendChild(im);box.appendChild(inn);s.appendChild(box);
  const fit=()=>{if(!box.isConnected){removeEventListener("resize",fit);return}const bw=box.clientWidth,bh=box.clientHeight,r=(im.naturalWidth||1)/(im.naturalHeight||1);let w=bw,h=bw/r;if(h>bh){h=bh;w=bh*r}inn.style.width=w+"px";inn.style.height=h+"px"};
  im.onload=fit;addEventListener("resize",fit);if(im.complete)fit();
  const bs=sc.spots.map(([x,y,r])=>{const b=document.createElement("button");b.className="spot";b.style.cssText=`left:${x}%;top:${y}%;width:${2*r}%`;b.setAttribute("aria-label","point chaud");inn.appendChild(b);return b});
  await dialogue(sc.lines,null);const body=$("qbody");body.innerHTML="";const hint=document.createElement("div");hint.className="hint";hint.textContent=sc.hint||"Cliquez sur chaque cercle rouge du plan.";body.appendChild(hint);
  const prog=document.createElement("div");prog.className="prog";$("bar").innerHTML="";$("bar").appendChild(prog);let found=0;const upd=()=>prog.textContent=`${found} / ${bs.length}`;upd();
  let idle=0;const arm=()=>{clearTimeout(idle);showHand(null);const nx=bs.find(b=>!b.classList.contains("ok"));if(nx)idle=setTimeout(()=>{if(nx.isConnected)showHand(nx)},5000)};
  bs.forEach(b=>{b.classList.add("live");b.onclick=()=>{if(b.classList.contains("ok"))return;b.classList.add("ok");found++;upd();
   if(found===bs.length){clearTimeout(idle);showHand(null);hint.textContent=sc.done||"Tous trouvés.";const btn=readyButton();btn.onclick=next}else arm()}});arm()},
 async end(sc,next){panel(true);scene(sc);cap(sc.cap);clearPanel();const body=$("qbody");
  const btn=nextButton(sc.btn);const ag=document.createElement("button");ag.className="again";ag.textContent="Revoir depuis le début";ag.onclick=()=>location.reload();$("bar").appendChild(ag);
  await dialogue(sc.lines,btn);if(journal.length){const j=document.createElement("div");j.className="journal";j.innerHTML=journal.map(e=>`<div><b>${e[0]}</b>${e[1]}</div>`).join("");body.appendChild(j);body.scrollTop=body.scrollHeight;stagger(j,GAP*.6).then(()=>body.scrollTop=body.scrollHeight)}
  btn.onclick=()=>{if(sc.href)location.href=sc.href}}
};
